<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My map</title>

  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>

  <style>
    body { margin: 0; }
    #map { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <div id="map"></div>

<div id="controls" style="
  position: absolute;
  top: 15px;
  left: 15px;
  z-index: 1;
  background: white;
  padding: 12px;
  border-radius: 5px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
">
  <button id="showAllBuildingsButton">Show All Buildings</button>

  <span style="display: inline-block; width: 15px;"></span>

  <input
    type="text"
    id="highlightBuildingsTextEntry"
    placeholder="e.g. Academic"
  >

  <button id="highlightBuildingsButton">Highlight By Use</button>
</div>

  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'basic.json',
      center: [-123.25, 49.26],
      zoom: 13
    });

    map.addControl(new maplibregl.NavigationControl());

    map.on('load', () => {
      map.on('click', 'ubc', onEachBuilding);

      map.on('mouseenter', 'ubc', () => {
        map.getCanvas().style.cursor = 'pointer';
      });

      map.on('mouseleave', 'ubc', () => {
        map.getCanvas().style.cursor = '';
      });
    });

    
function onEachBuilding(e) {
  const building = e.features[0].properties;

  const buildingName =
    building.NAME;
 

  const neighbourhood =
    building.NEIGHBOURHOOD;
   

  if (buildingName) {
    const popupText = neighbourhood
      ? `${buildingName} (${neighbourhood})`
      : buildingName;

    const popup = new maplibregl.Popup()
      .setLngLat(e.lngLat)
      .setText(String(popupText))
      .addTo(map);
  }
}

map.on('load', function () {
  const showAllButton = document.getElementById(
    'showAllBuildingsButton'
  );

  const highlightButton = document.getElementById(
    'highlightBuildingsButton'
  );

  const buildingInput = document.getElementById(
    'highlightBuildingsTextEntry'
  );

  // Show all buildings in their original style
  function showAllBuildings() {
    map.setFilter('ubc', null);
  }

  // Highlight buildings whose names contain the search text
  function highlightBuildings() {
    const searchText = buildingInput.value.trim();

    if (!searchText) {
      showAllBuildings();
      return;
    }

    map.setFilter('ubc', [
      'match',
      ['to-string', ['get', 'BLDG_USAGE']],
      [''],
      false,
      true
    ]);

    // Filter names using a case-insensitive substring match
    map.setFilter('ubc', [
      'case',
      [
        '!=',
        ['index-of', searchText.toLowerCase(),
          ['downcase', ['to-string', ['get', 'BLDG_USAGE']]]
        ],
        -1
      ],
      true,
      false
    ]);
  }

  showAllButton.addEventListener('click', showAllBuildings);
  highlightButton.addEventListener('click', highlightBuildings);

  // Allow Enter to run the search
  buildingInput.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') {
      highlightBuildings();
    }
  });
});
  </script>
</body>
</html>
